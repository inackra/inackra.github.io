name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_ENQUIRY_ENDPOINT: ${{ vars.VITE_ENQUIRY_ENDPOINT }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # Tell Bing (and other IndexNow engines) which pages changed, right after each deploy.
  # The key is public by design: it is also served at the site root.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Ping IndexNow with the sitemap's URLs
        env:
          KEY: 43346c466006847e2c8c4e985cf6b665
        run: |
          sleep 30
          urls=$(curl -fsS https://inackra.work/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's#</\?loc>##g' | jq -R . | jq -s .)
          jq -n --arg key "$KEY" --argjson urls "$urls" '{host:"inackra.work",key:$key,keyLocation:("https://inackra.work/"+$key+".txt"),urlList:$urls}' > body.json
          code=$(curl -sS -o resp.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' --data @body.json)
          echo "IndexNow: HTTP $code"; cat resp.txt
          case "$code" in 200|202) ;; *) exit 1;; esac
